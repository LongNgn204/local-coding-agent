name: Release applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tray:
    name: Build Tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop-tray/package-lock.json
            server/package-lock.json
      - name: Install bundled MCP runtime
        run: npm ci --omit=dev
        working-directory: server
      - name: Install Tray dependencies
        run: npm ci
        working-directory: desktop-tray
      - name: Set version from tag
        shell: bash
        working-directory: desktop-tray
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Test and package Tray
        shell: bash
        working-directory: desktop-tray
        run: |
          npm test
          npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: tray-${{ runner.os }}
          path: |
            desktop-tray/dist/*.exe
            desktop-tray/dist/*.zip
          if-no-files-found: error

  tray-classic:
    name: Build Tray Classic compatibility app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build self-contained compatibility executable
        shell: pwsh
        env:
          LCA_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $env:LCA_RELEASE_VERSION = $env:LCA_RELEASE_VERSION.TrimStart('v')
          ./tray-app/build-release.ps1
          $assetDir = Join-Path $PWD "tray-app/release-asset"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $asset = Get-ChildItem -Path (Join-Path $PWD "tray-app/publish") -Recurse -File -Filter "LocalCodingAgentTrayClassic-$env:LCA_RELEASE_VERSION-win-x64.exe" | Select-Object -First 1
          if (-not $asset) { throw "Classic tray release executable was not found." }
          Copy-Item -LiteralPath $asset.FullName -Destination $assetDir -Force
      - uses: actions/upload-artifact@v7
        with:
          name: tray-classic-windows
          path: tray-app/release-asset/*.exe
          if-no-files-found: error

  chrome-companion:
    name: Package Chrome Companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate extension
        run: npm run check
        working-directory: experiments/chrome-companion
      - name: Package extension
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd experiments/chrome-companion/extension
          zip -r "../../../ChromeCompanion-${version}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-companion
          path: ChromeCompanion-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: [tray, tray-classic, chrome-companion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: release-assets
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/RELEASE_NOTES_V${version//./_}.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" release-notes.md
          else
            printf '# Local Coding Agent %s\n\nSee CHANGELOG.md for details.\n' "$version" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: release-notes.md
